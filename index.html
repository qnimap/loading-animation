<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Loading Animation Test</title>

  <style>
body {
  margin: 0;
  background: transparent;
}

#loader {
  position: relative;
  width: 100vw;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

#logo svg {
  width: 200px;
  max-width: 80vw;
}


html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
}





#logo {
  position: relative;
  z-index: 1;
}

#loader-bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}



  </style>
</head>


<body>






<!-- ローディング画面 -->
  <div id="loader">
<svg
  id="loader-bg"
  viewBox="0 0 1000 1000"
  preserveAspectRatio="xMidYMid slice"
>
  <defs>
    <mask
      id="loader-mask"
      maskUnits="userSpaceOnUse"
      maskContentUnits="userSpaceOnUse"
      x="0"
      y="0"
      width="1000"
      height="1000"
    >
      <!-- 白い部分 = 表示 -->
      <rect
        width="1000"
        height="1000"
        fill="white"
      />

      <!-- 黒い部分 = 透明 -->
      <path
        id="mask-hole"
        fill="black"
      />
    </mask>
  </defs>

  <!-- 白い背景 -->
  <rect
    width="1000"
    height="1000"
    fill="white"
    mask="url(#loader-mask)"
  />
</svg>

<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>



<script>



  // SVGの中心
  const cx = 495.91;
  const cy = 515.93;

  // SVG全体を覆える半径
  const radius = 1500;

  // 扇形のパスを作る関数
  function createSector(angle) {
    const startAngle = -60;
    const endAngle = startAngle - angle;

    const startX = cx + radius * Math.cos(startAngle * Math.PI / 180);
    const startY = cy + radius * Math.sin(startAngle * Math.PI / 180);

    const endX = cx + radius * Math.cos(endAngle * Math.PI / 180);
    const endY = cy + radius * Math.sin(endAngle * Math.PI / 180);

    const largeArcFlag = angle > 180 ? 1 : 0;

    return `
      M ${cx} ${cy}
      L ${startX} ${startY}
      A ${radius} ${radius} 0 ${largeArcFlag} 0 ${endX} ${endY}
      Z
    `;
  }


  // 穴用の円形扇形を作る
function createHoleSector(angle, holeRadius = 75) {
  const holeCx = 500;
  const holeCy = 500;

  // 開始位置
  const startAngle = -70;

  // 線と同じく反時計回り
  const endAngle = startAngle - angle;

  const startX =
    holeCx + holeRadius * Math.cos(startAngle * Math.PI / 180);

  const startY =
    holeCy + holeRadius * Math.sin(startAngle * Math.PI / 180);

  const endX =
    holeCx + holeRadius * Math.cos(endAngle * Math.PI / 180);

  const endY =
    holeCy + holeRadius * Math.sin(endAngle * Math.PI / 180);

  const largeArcFlag = angle > 180 ? 1 : 0;

  // 最初は穴なし
  if (angle <= 0) {
    return "";
  }

  // 一周したら完全な円
  if (angle >= 359.9) {
    return `
      M ${holeCx - holeRadius} ${holeCy}
      a ${holeRadius} ${holeRadius} 0 1 0 ${holeRadius * 2} 0
      a ${holeRadius} ${holeRadius} 0 1 0 ${-holeRadius * 2} 0
    `;
  }

  return `
    M ${holeCx} ${holeCy}
    L ${startX} ${startY}
    A ${holeRadius} ${holeRadius}
      0 ${largeArcFlag} 0
      ${endX} ${endY}
    Z
  `;
}

  // 最初は文字を隠しておく
  gsap.set("#character", {
    opacity: 0,
    scale: 0.8,
    rotation: 0,
    transformOrigin: "center center"
  });

  // 円のアニメーション用
  const animation = {
    angle: 0,
    holeRadius: 75
  };

  // タイムライン作成
  const tl = gsap.timeline();

  // ① 線が上から反時計回りに現れる
  tl.to(animation, {
    angle: 359.99,
    duration: 2.5,
    ease: "power3.in",

    onUpdate: () => {
      document
        .querySelector("#revealShape")
        .setAttribute("d", createSector(animation.angle));

          // 同じ進行度で穴もぐるっと作る
  document
    .querySelector("#mask-hole")
    .setAttribute("d", createHoleSector(animation.angle, animation.holeRadius));
    },

    
    onComplete: () => {
      document
        .querySelector("#line")
        .removeAttribute("clip-path");
    }
  })

  // ② 少し間を空ける
  .to({}, {
    duration: 0.2
  })

  // ③ 文字が現れて少し大きく・傾く
  .to("#character", {
    opacity: 1,
    scale: 1.15,
    rotation: -8,
    duration: 0.18,
    ease: "power2.out"
  })

  // ④ 元の状態に戻る
  .to("#character", {
    scale: 1,
    rotation: 0,
    duration: 0.3,
    ease: "elastic.out(1, 0.5)"
  })

  // ⑤ ロゴ全体を少し待ってから拡大
  .to("#logo", {
    scale: 10,
    duration: 1.5,
    ease: "power4.in"
  })

.to(animation, {
  holeRadius: 750,
  duration: 1.5,
  ease: "power4.in",

  onUpdate: () => {
    document
      .querySelector("#mask-hole")
      .setAttribute(
        "d",
        createHoleSector(animation.angle, animation.holeRadius)
      );
  }
}, "<")


.set("#loader", {
  display: "none"
});

</script>
